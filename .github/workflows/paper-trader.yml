name: Paper Trader (live loop)

# Jalankan bot paper-trading AI dengan harga asli Indodax.
# State (dompet, otak, strategi) disimpan di branch terpisah `bot-state`
# supaya tidak mengotori kode utama.

on:
  workflow_dispatch:        # tombol "Run workflow" manual di tab Actions
    inputs:
      pair:
        description: "Pair (pakai 'scan' untuk mode multi-koin altcoin)"
        required: false
        default: scan
      interval:
        description: Periode candle (menit)
        required: false
        default: "60"
      poll:
        description: Detik antar-siklus
        required: false
        default: "30"
      evolve_every:
        description: Menit antar-evolusi strategi
        required: false
        default: "30"

  schedule:
    # CATATAN PENTING (terkonfirmasi empiris di repo ini): GitHub sering TIDAK
    # menjalankan / menunda `schedule:` — sejak repo dibuat, run event=schedule
    # = 0. JANGAN bergantung pada cron ini. Mekanisme otomatis yang ANDAL adalah
    # Watchdog (watchdog.yml) + tick eksternal via repository_dispatch:
    #   - gratis & tanpa akun: https://www.cronjob.dev (POST tiap 30 mnt ke
    #     .../dispatches dengan event_type "watchdog-tick")
    #   - atau curl-cron-job.com / GitHub Action di repo lain / server sendiri:
    #     curl -X POST -H "Authorization: Bearer <PAT>" \
    #       -d '{"event_type":"watchdog-tick"}' \
    #       https://api.github.com/repos/GibranGui/AiTradeV2/dispatches
    - cron: "*/15 * * * *"

permissions:
  contents: write            # izin push ke branch bot-state

concurrency:
  group: paper-trader
  # PENTING (perbaikan run #38519257448 dst): dulu `true` -> setiap dispatch
  # baru MEMBATALKAN run yang hampir selesai, sehingga langkah "Simpan state"
  # tidak pernah jalan dan snapshot bot-state hilang. Dengan `false`, run
  # berjalan sampai tuntas; run berlebih mengantri lalu digabung (max 1 antrian).
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout kode (branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore state dari branch bot-state (jika ada)
        run: |
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state
            git checkout origin/bot-state -- data/ || true
            echo "State dipulihkan dari branch bot-state."
          else
            echo "Belum ada state — mulai fresh (data/ bawaan repo)."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Snapshot status awal
        run: python -m ai_trader.main status | tee bot-report.txt

      - name: Jalankan loop paper trader (maks ~25 menit per siklus)
        env:
          PAIR: ${{ github.event.inputs.pair || 'IDRBTC' }}
          INTERVAL: ${{ github.event.inputs.interval || '60' }}
          POLL: ${{ github.event.inputs.poll || '30' }}
          EVOLVE_EVERY: ${{ github.event.inputs.evolve_every || '30' }}
        run: |
          # PAIR = "scan"/"all" -> mode multi-koin (altcoin scanner);
          # selain itu -> mode satu koin klasik.
          # CATATAN: tidak memakai util `timeout` shell (bisa menggantung bila
          # proses anak menahan pipe). Bot dibatasi lewat argumen --max-minutes
          # sehingga berhenti sendiri secara rapi sebelum job timeout.
          if [ "$PAIR" = "scan" ] || [ "$PAIR" = "all" ]; then
            python -m ai_trader.main scan \
              --interval "$INTERVAL" --poll "$POLL" \
              --evolve-every "$EVOLVE_EVERY" --min-vol 50000000 \
              --min-score "${{ vars.MIN_SCORE }}" \
              --max-minutes 20 || true
          else
            python -m ai_trader.main run \
              --pair "$PAIR" --interval "$INTERVAL" \
              --poll "$POLL" --evolve-every "$EVOLVE_EVERY" \
              --max-minutes 20 || true
          fi
          python -m ai_trader.main status >> bot-report.txt

      - name: Render dashboard performa (HTML statis)
        if: always()
        run: |
          # Dashboard dibaca dari state hasil run di atas -> site/index.html
          python -m ai_trader.dashboard --out site/index.html
          cat >> $GITHUB_STEP_SUMMARY <<SUM || true
          ### 📊 Dashboard
          Di-render otomatis tiap siklus → lihat branch \`gh-pages\` (GitHub Pages).
          SUM

      - name: Simpan state ke branch bot-state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "ai-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan bot-state
          # PENTING: branch bot-state TIDAK boleh berisi file workflow apa pun.
          # GITHUB_TOKEN default tidak punya scope `workflows`, jadi push ref yang
          # menyertakan .github/workflows/* akan DITOLAK GitHub ("refusing to allow
          # a GitHub App to create or update workflow ... without workflows
          # permission") dan seluruh snapshot state gagal. Hapus dulu dari index.
          git rm -r --cached .github --quiet 2>/dev/null || true
          git add -f data/ bot-report.txt site/
          git commit -m "state snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STATE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force "$STATE_URL" HEAD:refs/heads/bot-state
          # ── RANTAI LOOP OTOMATIS ────────────────────────────────────────────
          # Cron/schedule GitHub terbukti 0x fire di repo ini, jadi penggeraknya
          # adalah rantai self-dispatch berkecepatan penuh:
          #   Paper Trader selesai -> dispatch tick -> Watchdog -> dispatch
          #   Paper Trader lagi -> dst. Watchdog hanya memfilter saat ada tick
          #   EKSTERNAL (source != self-loop) supaya loop internal tidak pernah
          #   berhenti; tick eksternal (cronjob.org/curl-cron tiap :02/:32) tetap
          #   berfungsi sebagai pemantik & penjaga kalau rantai putus.
          # PENTING: API repository_dispatch HANYA menerima key `event_type` dan
          # `client_payload`. Key tambahan seperti `source` ditolak GitHub dengan
          # HTTP 422 ("\"source\" is not a permitted key") — inilah penyebab run
          # #38467126756 gagal. Sumber tick harus dikirim lewat client_payload.
          # ── RANTAI LOOP NONSTOP (teknis final) ────────────────────────────
          # 1) self-dispatch Paper Trader via curl + file JSON.
          #    Catatan empiris run #38483097882: `gh api` di dalam runner TIDAK
          #    bisa dispatch workflow lain ("Resource not accessible by
          #    integration" 403 — GITHUB_TOKEN milik run workflow_dispatch tidak
          #    boleh memicu workflow baru). Solusi: pakai PAT dari Secrets
          #    BOT_PAT yang disimpan di file, JANGAN lewat argumen ps.
          # 2) tick Watchdog via repository_dispatch (client_payload harus
          #    objek JSON asli; -F string dari gh ditolak 422).
          # ── RANTAI LOOP OTOMATIS (disederhanakan — 1 dispatch per siklus) ──
          # Masalah lama: Paper Trader mengirim DUA pemicu sekaligus (self-
          # dispatch workflow_dispatch + tick watchdog -> dispatch kedua).
          # Dengan cancel-in-progress:true, run yang hampir selesai dibatalkan
          # sebelum sempat menyimpan state (snapshot bot-state hilang).
          # Sekarang: HANYA satu mekanisme rantai — self-dispatch via BOT_PAT.
          # Watchdog tidak lagi dispatch untuk tick 'self-loop' (lihat
          # watchdog.yml); ia hanya penjaga pemantik jika rantai putus.
          printf '{"ref":"main","inputs":{"pair":"scan","interval":"60","poll":"30","evolve_every":"30"}}' > /tmp/pt.json
          if [ -n "${{ secrets.BOT_PAT }}" ]; then
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.BOT_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              --data @/tmp/pt.json \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paper-trader.yml/dispatches" \
              && echo "✅ Rantai berlanjut: Paper Trader di-dispatch ulang oleh dirinya sendiri." \
              || echo "⚠️ Self-dispatch gagal — rantai akan disambung Watchdog/tick eksternal."
          else
            echo "ℹ️ Secrets BOT_PAT belum diisi — self-dispatch dilewati; rantai dijaga tick eksternal/watchdog push."
          fi

      - name: Publikasikan dashboard ke GitHub Pages (branch gh-pages)
        if: always()
        run: |
          # Branch gh-pages dibuat & di-push ulang tiap siklus; Pages serve dari branch itu.
          # Catatan: GitHub TIDAK menjalankan cron/schedule pada repo PRIVATE —
          # kalau nanti repo diprivate, jalankan loop dengan self-hosted runner.
          BRANCH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q -b gh-pages
          git config user.name  "ai-trade-bot"
          git config user.email "bot@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/site/." . 2>/dev/null || true
          [ -f index.html ] || echo '<h1>Dashboard belum tersedia</h1>' > index.html
          git add -A
          git commit -q -m "dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "$BRANCH_URL" gh-pages:gh-pages

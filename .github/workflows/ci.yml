name: CI (smoke test)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit & integration tests (pipeline audit AiTradeV2)
        run: |
          # CATATAN (penyebab error CI run #38519257448): `pip install pytest`
          # tanpa batas versi memasang pytest 9.x, yang MENOLAK plugin pihak
          # ketiga dengan mark di fixture — libtmux (terbawa di image runner)
          # crash saat load: "Failed: Marks cannot be applied to fixtures."
          # Flag `-p no:libtmux` tidak menolong karena crash terjadi SEBELUM
          # flag diproses. Solusi permanen: pin pytest <9 (runtuh pada 8.4.x).
          pip install "pytest>=8,<9"
          python -m pytest tests/ -q -p no:libtmux \
            --junitxml=data/reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: data/reports/junit.xml
      - name: Evolusi singkat (data historis Indodax / fallback sintetis)
        run: python -m ai_trader.main evolve --pair IDRBTC --interval 60
      - name: Status
        run: python -m ai_trader.main status
